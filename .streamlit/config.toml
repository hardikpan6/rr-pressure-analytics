[server]
headless = true
runOnSave = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Rajasthan Royals-inspired dark theme: royal pink accent, deep navy surfaces, white text.
[theme]
base = "dark"
primaryColor = "#EA1A85"
backgroundColor = "#070D1F"
secondaryBackgroundColor = "#101A36"
textColor = "#EEF1F8"
linkColor = "#FF5CAD"
borderColor = "#22305A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeBackgroundColor = "#0C1530"
baseFontSize = 15
headingFontWeights = [800, 700, 700, 600, 600, 600]
headingFontSizes = ["34px", "26px", "20px", "17px", "15px", "13px"]
linkUnderline = false
dataframeBorderColor = "#22305A"
dataframeHeaderBackgroundColor = "#14204A"

redColor = "#FF5470"
orangeColor = "#FF9F43"
yellowColor = "#F2C94C"
greenColor = "#2ED39A"
blueColor = "#4F8BFF"
violetColor = "#A78BFA"
grayColor = "#8A94B3"

chartCategoricalColors = ["#EA1A85", "#4F8BFF", "#F2C94C", "#2ED39A", "#A78BFA", "#FF9F43", "#5CE1E6", "#8A94B3"]
chartSequentialColors = ["#17224A", "#2A2E6B", "#41318A", "#5C32A0", "#7B2FAE", "#9A2AB2", "#B723A8", "#D01D99", "#E31B8C", "#FF5CAD"]

[theme.sidebar]
backgroundColor = "#0A1229"
secondaryBackgroundColor = "#131E40"
borderColor = "#22305A"
textColor = "#EEF1F8"
